name: Android Release

# 打 tag（v1.0.1、v1.1.0 …）即自动构建「固定签名」的 APK 并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 从仓库 Secrets 还原签名文件，保证每次构建用同一把 key（可覆盖升级）
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../key.jks\n' \
            "$STORE_PASSWORD" "${KEY_PASSWORD:-$STORE_PASSWORD}" "${KEY_ALIAS:-whale}" > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: 鲸记账 ${{ github.ref_name }}
          body: |
            鲸记账 ${{ github.ref_name }}

            - Android APK：`app-release.apk`（固定签名，可直接覆盖安装）
            - 网页版：https://niceday-hh.github.io/dsv41flash_app1/
          fail_on_unmatched_files: true
