<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="/dsv41flash_app1/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="description" content="鲸记账 · 一款时尚轻盈的 iOS 风格记账应用，支持账单明细、数据可视化、消费预算与个性化设置。">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鲸记账">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>鲸记账 · Whale Ledger</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #6C5CE7;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6C5CE7 0%, #9B8CFF 100%);
      transition: opacity .45s ease;
      z-index: 9999;
      font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    }
    #boot .logo {
      width: 92px; height: 92px;
      border-radius: 28px;
      background: rgba(255,255,255,.16);
      border: 1.5px solid rgba(255,255,255,.34);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 44px; font-weight: 700;
      box-shadow: 0 18px 40px rgba(40,20,120,.28);
      animation: pop .8s cubic-bezier(.2,1.2,.4,1) both;
    }
    #boot .name { margin-top: 20px; color: #fff; font-size: 21px; font-weight: 700; letter-spacing: 3px; animation: fade 1s .25s both; }
    #boot .sub { margin-top: 8px; color: rgba(255,255,255,.72); font-size: 10px; letter-spacing: 4px; font-weight: 600; animation: fade 1s .45s both; }
    @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  </style>

  <script>
    var serviceWorkerVersion = '3951319008';
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="boot">
    <div class="logo">鲸</div>
    <div class="name">鲸记账</div>
    <div class="sub">WHALE LEDGER</div>
  </div>

  <script>
    function hideBoot() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 460);
    }

    // 清理历史 Service Worker 缓存，保证每次访问都是最新版本
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }

    window.addEventListener('load', function () {
      // 不启用 Service Worker：直接以 <script> 方式加载入口，避免 CDN 缓存导致的白屏
      _flutter.loader.loadEntrypoint().then(function (engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function (appRunner) {
        appRunner.runApp();
        setTimeout(hideBoot, 400);
      }).catch(function (err) {
        console.error('Flutter bootstrap failed:', err);
        hideBoot();
      });
    });
  </script>
</body>
</html>
